openapi: 3.1.0
info:
  title: Penny sync relay
  version: 1.0.0
  description: |
    Store-and-forward relay for end-to-end encrypted event blobs. The server never sees
    plaintext user data. All binary values are base64url without padding (padded input is
    accepted). Timestamps are epoch milliseconds. Errors use `{"error": "..."}`.
servers:
  - url: https://relay.example.com
security:
  - bearer: []
tags:
  - name: auth
  - name: streams
  - name: keys
  - name: spaces
  - name: devices
  - name: advisor
  - name: connectors
    description: |
      Bank connectors (Plus). Provider credentials stay on the server, sealed with AES-256-GCM;
      transactions pass through in the sync response and are not stored. Money is signed integer
      minor units (negative = money out).
  - name: entitlements
  - name: mail
    description: |
      Email forwarding (CP-06). Inbound mail is sealed to the account's mail public key during
      the webhook request with scheme penny-mail-v1 (ECIES: ephemeral ECDH on P-256 or X25519,
      HKDF-SHA256 with salt = ephPub || recipientPub and info "penny-mail-v1", AES-256-GCM with a
      12-byte nonce and AAD "penny-mail-v1"; blob = ephPub || nonce || ciphertext+tag). Only the
      ciphertext is stored, for at most 14 days. See README for byte layouts.
  - name: merchants
    description: |
      Community merchant map (PY-03). Anonymous, k-anonymous (>= 3 agreeing contributors and
      >= 60% of votes) descriptor -> name/category suggestions per region. Never receives amounts.

paths:
  /healthz:
    get:
      security: []
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string }, region: { type: string } } }

  /v1/auth/start:
    post:
      tags: [auth]
      security: []
      summary: Email a 6-digit sign-in code (valid 10 minutes, 5 attempts)
      description: Always 204 for a valid address, whether or not an account exists. Rate-limited per email and per IP.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartAuth" } } }
      responses:
        "204": { description: Code sent }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/Error" }

  /v1/auth/verify:
    post:
      tags: [auth]
      security: []
      summary: Exchange the code for a device session; creates the account on first sign-in
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerifyAuth" } } }
      responses:
        "200":
          description: Signed in
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: "Wrong, expired or burned code", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/streams/{stream}/events:
    parameters: [ { $ref: "#/components/parameters/stream" } ]
    post:
      tags: [streams]
      summary: Append encrypted events
      description: |
        A personal stream is created implicitly on its owner's first push. Space streams accept
        pushes from active members except VIEWER and NONE. Max 1000 blobs and 2 MB per request.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PushBody" } } }
      responses:
        "200":
          description: Appended; cursor of the last event
          content: { application/json: { schema: { $ref: "#/components/schemas/PushResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [streams]
      summary: Pull events after a cursor, ordered by cursor
      description: A stream that does not exist yet returns an empty list.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 }, description: "Values above 500 are clamped." }
      responses:
        "200":
          description: Events
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PulledBlob" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/keys:
    get:
      tags: [keys]
      summary: All wrapped stream keys stored for the caller's account
      responses:
        "200":
          description: Keys
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StreamKey" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/keys/{stream}/{accountId}:
    parameters:
      - { $ref: "#/components/parameters/stream" }
      - { name: accountId, in: path, required: true, schema: { type: string } }
    put:
      tags: [keys]
      summary: Store a stream key wrapped for one member
      description: Allowed for the owner of a personal stream (for themselves), a space OWNER/ADMIN (for any active member), or the member themselves.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StreamKey" } } }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/spaces:
    post:
      tags: [spaces]
      summary: Create a shared space; the caller becomes OWNER
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SpaceCreate" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/SpaceCreate" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: Stream id already in use, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  /v1/spaces/{space}/invites:
    parameters: [ { $ref: "#/components/parameters/space" } ]
    post:
      tags: [spaces]
      summary: Create an invite (OWNER/ADMIN)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InviteCreate" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/InviteInfo" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/invites/{token}:
    parameters: [ { $ref: "#/components/parameters/token" } ]
    get:
      tags: [spaces]
      security: []
      summary: Show what an invite will share (no auth)
      responses:
        "200":
          description: Usable invite
          content: { application/json: { schema: { $ref: "#/components/schemas/InviteInfo" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
    delete:
      tags: [spaces]
      summary: Revoke an invite (OWNER/ADMIN of its space)
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/invites/{token}/accept:
    parameters: [ { $ref: "#/components/parameters/token" } ]
    post:
      tags: [spaces]
      summary: Accept an invite (single use; max 10 active members per space)
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/InviteAccept" } } }
      responses:
        "200":
          description: Joined
          content: { application/json: { schema: { $ref: "#/components/schemas/InviteInfo" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already a member, or the space is full", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "410": { $ref: "#/components/responses/Gone" }

  /v1/spaces/{space}/members:
    parameters: [ { $ref: "#/components/parameters/space" } ]
    get:
      tags: [spaces]
      summary: List members, including those who left (active members only)
      responses:
        "200":
          description: Members ordered by joinedAt
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MemberInfo" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/spaces/{space}/members/{account}:
    parameters:
      - { $ref: "#/components/parameters/space" }
      - { name: account, in: path, required: true, schema: { type: string } }
    put:
      tags: [spaces]
      summary: Change a member's role
      description: OWNER/ADMIN only. Only an OWNER may grant OWNER or change an OWNER's role. The last owner cannot be demoted (409).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleChange" } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [spaces]
      summary: Remove a member (OWNER/ADMIN) or leave (self)
      description: Marks the member as left and drops their wrapped key; history stays. The last owner must transfer ownership before leaving a space that has other members. When the last member leaves, the space is deleted.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/devices:
    get:
      tags: [devices]
      summary: Signed-in devices of the caller's account
      responses:
        "200":
          description: Devices
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DeviceInfo" } } } }

  /v1/devices/{id}:
    delete:
      tags: [devices]
      summary: Sign a device out remotely (revokes its tokens)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/account:
    delete:
      tags: [devices]
      summary: Delete the account and everything it owns, immediately
      description: Ownership of shared spaces passes to the earliest admin, else the earliest member; spaces with no other members are deleted.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/advisor/{id}:
    parameters: [ { $ref: "#/components/parameters/advisorId" } ]
    put:
      tags: [advisor]
      summary: Create or replace a read-only advisor link blob
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdvisorPut" } } }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: Id belongs to another account, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [advisor]
      summary: Delete an advisor link
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/advisor/{id}/blob:
    parameters: [ { $ref: "#/components/parameters/advisorId" } ]
    get:
      tags: [advisor]
      security: []
      summary: Public ciphertext for the advisor page (CORS enabled; 404 after expiry)
      responses:
        "200":
          description: Blob
          content:
            application/json:
              schema:
                type: object
                required: [blob, expiresAt]
                properties:
                  blob: { type: string, description: "base64url(12-byte IV || AES-256-GCM ciphertext+tag)" }
                  expiresAt: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/NotFound" }

  /a/{id}:
    parameters: [ { $ref: "#/components/parameters/advisorId" } ]
    get:
      tags: [advisor]
      security: []
      summary: Static read-only page; decrypts the blob with the key in the URL fragment
      responses:
        "200":
          description: HTML page
          content: { text/html: { schema: { type: string } } }

  /v1/connectors:
    get:
      tags: [connectors]
      summary: Every known connector, enabled ones first
      responses:
        "200":
          description: Connectors
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectorInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/connections:
    get:
      tags: [connectors]
      summary: The caller's bank connections (without accounts)
      responses:
        "200":
          description: Connections ordered by createdAt
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Connection" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [connectors]
      summary: Start a connection
      description: |
        Token providers (SimpleFIN) complete immediately and answer 201 with the Connection and its
        accounts. Redirect providers answer 200 with a consent URL and state; post the callback
        parameters to /v1/connections/complete. Requires Plus except in dev mode and for `sandbox`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConnectRequest" } } }
      responses:
        "200":
          description: Redirect provider; open redirectUrl
          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectRedirect" } } }
        "201":
          description: Token provider; connected
          content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PlusRequired" }
        "409": { description: Consent required or access revoked at the provider, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "501": { description: Provider not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "502": { description: Provider error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "504": { description: Provider timed out, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  /v1/connections/complete:
    post:
      tags: [connectors]
      summary: Finish a redirect consent (new connection or re-consent)
      description: The state is single use and valid for 30 minutes. A re-consent keeps the connection id and answers 200.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteRequest" } } }
      responses:
        "200":
          description: Consent renewed
          content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } }
        "201":
          description: Connected
          content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } }
        "400": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/PlusRequired" }
        "404": { description: Unknown or already used state, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "410": { description: Consent session expired, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "502": { $ref: "#/components/responses/Error" }

  /v1/connections/{id}:
    parameters: [ { $ref: "#/components/parameters/connectionId" } ]
    delete:
      tags: [connectors]
      summary: Disconnect
      description: Revokes access at the provider (best-effort), then deletes the sealed credentials, sync cursor and pending consents. Never requires Plus.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/connections/{id}/sync:
    parameters: [ { $ref: "#/components/parameters/connectionId" } ]
    post:
      tags: [connectors]
      summary: Fetch transactions not delivered before
      description: |
        Per remote account, the window starts 7 days before its last fetch (90 days back the first
        time, or `since`), and transactions already delivered are skipped by id hash. A pending
        transaction that posts under the same id is delivered again with pending=false: upsert by
        (connection id, transaction id). Provider problems answer 200 with a non-active status,
        empty lists and a message. The body may be empty (all accounts).
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/SyncRequest" } } }
      responses:
        "200":
          description: New transactions and current balances
          content: { application/json: { schema: { $ref: "#/components/schemas/SyncResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/PlusRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/connections/{id}/reconsent:
    parameters: [ { $ref: "#/components/parameters/connectionId" } ]
    post:
      tags: [connectors]
      summary: Renew consent for an existing connection
      description: Same body and answers as POST /v1/connections; provider comes from the connection. Token providers answer 200 with the renewed Connection.
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ConnectRequest" } } }
      responses:
        "200":
          description: Redirect (ConnectRedirect) or renewed connection (Connection)
          content:
            application/json:
              schema: { oneOf: [ { $ref: "#/components/schemas/ConnectRedirect" }, { $ref: "#/components/schemas/Connection" } ] }
        "400": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/PlusRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/entitlements/plus:
    get:
      tags: [entitlements]
      summary: The caller's Plus entitlement
      responses:
        "200":
          description: Entitlement (plusUntil null when none)
          content: { application/json: { schema: { $ref: "#/components/schemas/Entitlement" } } }
    put:
      tags: [entitlements]
      summary: Record a store purchase
      description: |
        Sets plusUntil to now + 32 days for subscriptions, 9999-12-31 for product ids containing
        "lifetime"; never shortens an existing grant. NOT YET VERIFIED with the Google Play
        Developer API; that must be added before launch.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementRequest" } } }
      responses:
        "200":
          description: Recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/Entitlement" } } }
        "400": { $ref: "#/components/responses/Error" }

  /v1/mail/address:
    get:
      tags: [mail]
      summary: The caller's forwarding address
      responses:
        "200":
          description: Address
          content: { application/json: { schema: { $ref: "#/components/schemas/MailAddress" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No address issued, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    post:
      tags: [mail]
      summary: Get or create the forwarding address; rotate to replace it
      description: Idempotent without rotate. With rotate=true a new address is issued and the old one stops working immediately; pending mail is kept.
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/MailAddressRequest" } } }
      responses:
        "200":
          description: Address
          content: { application/json: { schema: { $ref: "#/components/schemas/MailAddress" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [mail]
      summary: Turn forwarding off (deletes the address, the key and pending mail)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/mail/key:
    put:
      tags: [mail]
      summary: Set the public key forwarded mail is sealed to (exactly one of p256 or x25519)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MailKey" } } }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/mail/pending:
    get:
      tags: [mail]
      summary: Sealed mail waiting for the device, oldest first (max 50)
      responses:
        "200":
          description: Pending mail
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PendingMail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/mail/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" } } ]
    delete:
      tags: [mail]
      summary: Delete a pending mail after parsing it
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/mail/inbound:
    post:
      tags: [mail]
      security: [ { webhook: [] } ]
      summary: Inbound mail webhook for the email provider
      description: |
        Requires X-Penny-Webhook (MAIL_WEBHOOK_SECRET; not needed in -dev when unset). The first
        recipient on MAIL_DOMAIN with a well-formed local part is used (case-insensitive, +tag
        ignored). If text is blank, html is stripped to text. The plaintext is sealed before
        storage; mail for an account without a key is discarded. Max 2 MB body.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/InboundMail" } }
          multipart/form-data: { schema: { $ref: "#/components/schemas/InboundMail" } }
          application/x-www-form-urlencoded: { schema: { $ref: "#/components/schemas/InboundMail" } }
      responses:
        "204": { description: Sealed and stored, or discarded because the account has no key }
        "400": { $ref: "#/components/responses/Error" }
        "401": { description: Missing webhook secret, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "403": { description: Wrong webhook secret, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "404": { description: 'Unknown address; body is always {"error":"not found"}', content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "503": { description: Webhook secret not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  /v1/merchants/suggest:
    post:
      tags: [merchants]
      summary: Clean names and categories for descriptors the community agrees on
      description: Returns only descriptors whose leading mapping has >= 3 distinct contributors and >= 60% of votes. Rate-limited to 60 requests/minute/account.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MerchantSuggestRequest" } } }
      responses:
        "200":
          description: Known descriptors (possibly empty)
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MerchantSuggestion" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/merchants/contribute:
    post:
      tags: [merchants]
      summary: Vote for descriptor mappings (opt-in; 100 items/day/account)
      description: |
        One vote per (region, normalised descriptor, contributor); a later vote replaces the earlier
        one. The whole request is rejected (400, naming the item) if any item fails validation,
        including email-, IBAN- or long-number-like content.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MerchantContributeRequest" } } }
      responses:
        "200":
          description: Recorded
          content: { application/json: { schema: { type: object, required: [accepted], properties: { accepted: { type: integer } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    webhook: { type: apiKey, in: header, name: X-Penny-Webhook }
  parameters:
    stream: { name: stream, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" } }
    space: { name: space, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" } }
    token: { name: token, in: path, required: true, schema: { type: string } }
    advisorId: { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" } }
    connectionId: { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    Unauthorized: { description: "Missing, invalid or revoked token", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    Forbidden: { description: Not allowed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    Gone: { description: "Expired, revoked or used", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    PlusRequired: { description: 'No active Plus entitlement; body is {"error":"plus_required"}', content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    RateLimited:
      description: Too many requests
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
  schemas:
    Role: { type: string, enum: [OWNER, ADMIN, EDITOR, CONTRIBUTOR, VIEWER, NONE] }
    ErrorBody: { type: object, required: [error], properties: { error: { type: string } } }
    StartAuth: { type: object, required: [email], properties: { email: { type: string, format: email } } }
    VerifyAuth:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }
        deviceName: { type: string, maxLength: 100 }
        platform: { type: string, maxLength: 32 }
        publicKey: { type: string, maxLength: 2048 }
    Session:
      type: object
      required: [accountId, deviceId, token, salt, region]
      properties:
        accountId: { type: string }
        deviceId: { type: string }
        token: { type: string, description: "Bearer token; shown once, stored only as SHA-256" }
        salt: { type: string, description: "16 random bytes, base64url, fixed per account" }
        region: { type: string, enum: [us, eu, in, sg] }
    PushBody:
      type: object
      required: [blobs]
      properties: { blobs: { type: array, minItems: 1, maxItems: 1000, items: { type: string } } }
    PushResult: { type: object, required: [cursor], properties: { cursor: { type: integer, format: int64 } } }
    PulledBlob:
      type: object
      required: [cursor, blob, device]
      properties:
        cursor: { type: integer, format: int64 }
        blob: { type: string }
        device: { type: string }
    StreamKey:
      type: object
      required: [wrapped]
      properties:
        stream: { type: string }
        accountId: { type: string }
        wrapped: { type: string, maxLength: 8192 }
        kind: { type: string, maxLength: 64 }
    SpaceCreate: { type: object, required: [spaceId], properties: { spaceId: { type: string } } }
    InviteCreate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, EDITOR, CONTRIBUTOR, VIEWER] }
        expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
        summary: { type: string, maxLength: 1000, description: "Shown to the invitee before accepting; visible to the server, keep it generic" }
    InviteInfo:
      type: object
      required: [token, spaceId, role, expiresAt, summary, inviterPublicKey]
      properties:
        token: { type: string }
        spaceId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expiresAt: { type: integer, format: int64 }
        summary: { type: string }
        inviterPublicKey: { type: string }
    InviteAccept: { type: object, properties: { publicKey: { type: string, maxLength: 2048 } } }
    MemberInfo:
      type: object
      required: [accountId, role, publicKey, joinedAt, left]
      properties:
        accountId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        publicKey: { type: string }
        joinedAt: { type: integer, format: int64 }
        left: { type: boolean }
    RoleChange: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } }
    DeviceInfo:
      type: object
      required: [deviceId, name, platform, lastSeen, current]
      properties:
        deviceId: { type: string }
        name: { type: string }
        platform: { type: string }
        lastSeen: { type: integer, format: int64 }
        current: { type: boolean }
    AdvisorPut:
      type: object
      required: [blob, expiresAt]
      properties:
        blob: { type: string, description: "base64url(12-byte IV || ciphertext+tag), max 256 KiB" }
        expiresAt: { type: integer, format: int64, description: "Epoch ms, in the future and at most 90 days ahead" }
    ConnectorInfo:
      type: object
      required: [id, name, kind, regions, enabled]
      properties:
        id: { type: string, examples: [simplefin] }
        name: { type: string }
        kind: { type: string, enum: [redirect, token] }
        regions: { type: array, items: { type: string }, description: 'ISO 3166-1 alpha-2, "EU" for the EEA, "*" for anywhere' }
        enabled: { type: boolean }
    ConnectRequest:
      type: object
      properties:
        provider: { type: string, description: "Required on POST /v1/connections; optional (must match) on reconsent" }
        redirectUri: { type: string, maxLength: 2048, description: "Required for redirect providers, e.g. an app link" }
        token: { type: string, maxLength: 4096, description: "Required for token providers (SimpleFIN Setup Token)" }
    ConnectRedirect:
      type: object
      required: [redirectUrl, state]
      properties:
        redirectUrl: { type: string }
        state: { type: string }
    CompleteRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, maxLength: 512 }
        params: { type: object, additionalProperties: { type: string }, maxProperties: 32, description: "Callback query parameters" }
    ConnectionStatus: { type: string, enum: [active, needs_consent, broken, disconnected] }
    Connection:
      type: object
      required: [id, provider, institution, status, consentExpiry, lastSyncedAt, createdAt]
      properties:
        id: { type: string }
        provider: { type: string }
        institution: { type: string }
        status: { $ref: "#/components/schemas/ConnectionStatus" }
        consentExpiry: { type: [integer, "null"], format: int64 }
        lastSyncedAt: { type: [integer, "null"], format: int64 }
        createdAt: { type: integer, format: int64 }
        accounts: { type: array, items: { $ref: "#/components/schemas/RemoteAccount" }, description: "Only on connect, complete and token re-consent" }
    RemoteAccount:
      type: object
      required: [id, name, currency, type, balanceMinor]
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string, description: "ISO 4217 code (or a provider currency identifier)" }
        type: { type: string, description: 'checking, savings, credit, loan, investment, or "" when unknown' }
        balanceMinor: { type: integer, format: int64 }
    RemoteTx:
      type: object
      required: [id, accountId, date, amountMinor, currency, description, pending]
      properties:
        id: { type: string }
        accountId: { type: string }
        date: { type: integer, format: int64, description: "Epoch ms (UTC)" }
        amountMinor: { type: integer, format: int64, description: "Signed minor units; negative = money out" }
        currency: { type: string }
        description: { type: string }
        pending: { type: boolean }
    SyncRequest:
      type: object
      properties:
        accounts: { type: array, maxItems: 100, items: { type: string }, description: "Remote account ids; empty = all" }
        since: { type: integer, format: int64, description: "Epoch ms; overrides the cursor window (clamped to 2 years)" }
        full: { type: boolean, description: "Re-deliver transactions already delivered in the window" }
    SyncResult:
      type: object
      required: [transactions, accounts, status]
      properties:
        transactions: { type: array, items: { $ref: "#/components/schemas/RemoteTx" } }
        accounts: { type: array, items: { $ref: "#/components/schemas/RemoteAccount" } }
        status: { $ref: "#/components/schemas/ConnectionStatus" }
        message: { type: string }
    EntitlementRequest:
      type: object
      required: [store, purchaseToken, productId]
      properties:
        store: { type: string, enum: [play] }
        purchaseToken: { type: string, maxLength: 4096 }
        productId: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
    Entitlement:
      type: object
      required: [plus, plusUntil]
      properties:
        plus: { type: boolean, description: "Active now (always true in dev mode)" }
        plusUntil: { type: [integer, "null"], format: int64 }
        productId: { type: string }
        store: { type: string }
    MailAddressRequest: { type: object, properties: { rotate: { type: boolean, default: false } } }
    MailAddress:
      type: object
      required: [address, keyAlg]
      properties:
        address: { type: string, examples: [k3m9q2xwpa@in.penny.example], description: "10 chars of a-z2-7 @ MAIL_DOMAIN" }
        keyAlg: { type: string, enum: ["", p256, x25519], description: '"" until a key is set' }
    MailKey:
      type: object
      properties:
        p256: { type: string, description: "base64url of the 65-byte uncompressed P-256 point (0x04 || X || Y). Preferred." }
        x25519: { type: string, description: "base64url of the raw 32-byte X25519 public key" }
    PendingMail:
      type: object
      required: [id, alg, blob, receivedAt, expiresAt]
      properties:
        id: { type: string }
        alg: { type: string, enum: [p256, x25519] }
        blob: { type: string, description: "base64url(ephPub (65 for p256, 32 for x25519) || nonce(12) || AES-256-GCM ciphertext+tag(16)); plaintext is JSON {from, subject, text, receivedAt}" }
        receivedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64, description: "receivedAt + 14 days" }
    InboundMail:
      type: object
      required: [to]
      properties:
        to: { type: string, description: "Recipient header value; may hold several addresses" }
        from: { type: string }
        subject: { type: string }
        text: { type: string }
        html: { type: string, description: "Used (stripped to text) only when text is blank" }
    MerchantSuggestRequest:
      type: object
      required: [region, descriptors]
      properties:
        region: { type: string, pattern: "^[A-Za-z]{2}$" }
        descriptors: { type: array, maxItems: 200, items: { type: string } }
    MerchantSuggestion:
      type: object
      required: [descriptor, name, categoryKey, confidence]
      properties:
        descriptor: { type: string, description: "Echo of the descriptor as sent" }
        name: { type: string }
        categoryKey: { type: string }
        confidence: { type: number, minimum: 0.6, maximum: 1, description: "Vote share of this mapping, two decimals" }
    MerchantItem:
      type: object
      required: [descriptor, name, categoryKey]
      properties:
        descriptor: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 48 }
        categoryKey: { type: string, pattern: "^[a-z]+(\\.[a-z]+)?$" }
    MerchantContributeRequest:
      type: object
      required: [region, items]
      properties:
        region: { type: string, pattern: "^[A-Za-z]{2}$" }
        items: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/MerchantItem" } }
